<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="262" viewBox="0 0 1200 262" role="img" aria-labelledby="title desc">
  <title id="title">Repository structure</title>
  <desc id="desc">Terraform + Ansible IaC layout</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#1f2937"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <style>
      .title { font: 700 34px Inter, ui-sans-serif, system-ui, sans-serif; fill: #f9fafb; }
      .subtitle { font: 500 18px Inter, ui-sans-serif, system-ui, sans-serif; fill: #cbd5e1; }
      .mono { font: 500 21px 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; fill: #e5e7eb; }
      .muted { fill: #94a3b8; }
    </style>
  </defs>
  <rect width="1200" height="262" fill="#0b1020"/>
  <rect x="40" y="42" width="1120" height="178" rx="24" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="40" y="42" width="1120" height="54" rx="24" fill="#020617"/>
  <circle cx="76" cy="69" r="8" fill="#ef4444"/><circle cx="104" cy="69" r="8" fill="#f59e0b"/><circle cx="132" cy="69" r="8" fill="#22c55e"/>
  <rect x="990" y="60" width="120" height="16" rx="8" fill="#0ea5e9" opacity="0.7"/>
  <text x="38" y="-10" class="muted">sanitized example</text>
  <text x="38" y="-10" class="muted">public-safe mock</text>
  <text x="38" y="-10" class="muted">no private values</text>
  <text x="72" y="145" class="title">Repository structure</text>
  <text x="72" y="178" class="subtitle">Terraform + Ansible IaC layout</text>
  <rect x="72" y="206" width="1064" height="8" rx="16" fill="#020617" stroke="#334155"/>
<text x="38" y="112" class="mono">terraform/modules/qemu-vm/</text>
<text x="38" y="140" class="mono">terraform/locals.tf</text>
<text x="38" y="168" class="mono">ansible/inventories/generated/</text>
<text x="38" y="196" class="mono">.gitea/workflows/terraform-plan.yml</text>

</svg>